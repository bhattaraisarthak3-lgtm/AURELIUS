<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AURELIUS — Hyper-Speed Loader</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #FDFDFD;
      --fg: #0b0b0b;
      --muted: rgba(11,11,11,0.12);
      --accent: #000;
      --size: 160px; /* base loader scale */
    }

    /* Page layout */
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      box-sizing:border-box;
    }

    .stage{
      width:100%;
      max-width:960px;
      height:420px;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius:12px;
      background:linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.01) 100%);
      box-shadow: 0 10px 30px rgba(11,11,11,0.03);
    }

    /* subtle paper grain (data url SVG) */
    .stage::before{
      content:"";
      position:absolute;
      inset:0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
      opacity:0.03;
      pointer-events:none;
    }

    /* Moving horizontal lines in background (longfazers) */
    .longfazers{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
    }
    .longfazers span{
      position:absolute;
      height:3px;
      width:40%;
      background:var(--fg);
      opacity:0.08;
      border-radius:6px;
      transform:translateX(120%);
      will-change:transform,opacity;
      filter: blur(0.2px);
    }
    .longfazers span:nth-child(1){ top:18%; animation:lf 1.6s linear infinite; animation-delay:-0.8s; opacity:0.08; }
    .longfazers span:nth-child(2){ top:36%; animation:lf 1.9s linear infinite; animation-delay:-0.4s; opacity:0.06; }
    .longfazers span:nth-child(3){ top:56%; animation:lf 1.4s linear infinite; animation-delay:-1.2s; opacity:0.09; }
    .longfazers span:nth-child(4){ top:74%; animation:lf 1.1s linear infinite; animation-delay:-0.2s; opacity:0.05; }

    @keyframes lf {
      0% { transform: translateX(120%); opacity:0.09; }
      70% { opacity:0.06; }
      100% { transform: translateX(-120%); opacity:0; }
    }

    /* Loader center block */
    .loader-wrap{
      position:relative;
      z-index:5;
      width:var(--size);
      height:var(--size);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* The character-like loader (replicated & improved) */
    .loader{
      position:relative;
      width:120px;
      height:40px;
      transform-origin:center;
      animation: speeder 1.2s ease-in-out infinite;
      display:block;
    }

    /* thin moving "laser" lines that burst from the character */
    .loader > .lasers{
      position:absolute;
      left:60px;
      top:-22px;
      width:35px;
      height:6px;
      border-radius:4px;
    }
    .laser-line{
      position:absolute;
      width:30px;
      height:1px;
      background:var(--accent);
      left:0;
      top:0;
      transform-origin:left center;
      opacity:1;
      will-change:left,opacity;
    }
    .laser-line:nth-child(1){ top:0; animation: lazerA 0.45s linear infinite; }
    .laser-line:nth-child(2){ top:3px; animation: lazerB 0.65s linear infinite; }
    .laser-line:nth-child(3){ top:1px; animation: lazerC 0.6s linear infinite; animation-delay:-0.12s; }
    .laser-line:nth-child(4){ top:4px; animation: lazerD 1s linear infinite; animation-delay:-0.25s; }

    @keyframes lazerA { 0% { left:0; opacity:1; } 100% { left:-80px; opacity:0; } }
    @keyframes lazerB { 0% { left:0; opacity:1; } 100% { left:-100px; opacity:0; } }
    @keyframes lazerC { 0% { left:0; opacity:1; } 100% { left:-50px; opacity:0; } }
    @keyframes lazerD { 0% { left:0; opacity:1; } 100% { left:-150px; opacity:0; } }

    /* geometric "base" body - triangles and circle */
    .base{
      position:absolute;
      right:-6px;
      top:-6px;
      width:120px;
      height:40px;
      pointer-events:none;
    }
    .base .tri{
      position:absolute;
      width:0;
      height:0;
      border-top:10px solid transparent;
      border-right:140px solid var(--accent);
      border-bottom:10px solid transparent;
      right:0;
      top:10px;
      transform-origin:center;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,0.02));
    }
    .base .core{
      position:absolute;
      right:24px;
      top:-8px;
      width:28px;
      height:28px;
      background:var(--accent);
      border-radius:50%;
      box-shadow: 0 6px 18px rgba(11,11,11,0.06);
      transform-origin:center;
      animation: core-bob 1.8s ease-in-out infinite;
    }
    .base .fins{
      content:"";
      position:absolute;
      right:38px;
      top:-4px;
      width:60px;
      height:22px;
      background:var(--accent);
      clip-path: polygon(0 0, 100% 0, 86% 66%, 0% 100%);
      transform: rotate(-6deg);
      transform-origin:left center;
    }

    @keyframes core-bob{
      0%{ transform: translateY(0) rotate(0deg); }
      50%{ transform: translateY(2px) rotate(1deg); }
      100%{ transform: translateY(0) rotate(0deg); }
    }

    /* small face shape on the front */
    .face{
      position:absolute;
      right:6px;
      top:-12px;
      width:22px;
      height:12px;
      background:var(--accent);
      border-radius:20px 20px 0 0;
      transform: rotate(-42deg);
      transform-origin:center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .face::after{
      content:"";
      position:absolute;
      right:3px;
      top:6px;
      width:12px;
      height:12px;
      background:var(--accent);
      border-radius:0 0 0 2px;
      transform: rotate(40deg);
      transform-origin:center;
    }

    /* small jitter rotation for liveliness */
    @keyframes speeder {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      25% { transform: translate(1px, 2px) rotate(1deg); }
      50% { transform: translate(-1px, 1px) rotate(-1deg); }
      75% { transform: translate(2px, -1px) rotate(1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    /* Header + subtitle */
    .meta{
      margin-top:22px;
      text-align:center;
      z-index:6;
      color:var(--fg);
    }
    .meta h1{
      font-family:'Space Grotesk', 'Outfit', sans-serif;
      font-weight:700;
      letter-spacing:0.08em;
      font-size:20px;
      margin:0;
      text-transform:uppercase;
    }
    .meta p{
      margin:8px 0 0 0;
      font-size:12px;
      color: #6b6b6b;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }

    /* center progress bar */
    .progress{
      margin-top:16px;
      width:260px;
      height:8px;
      border-radius:999px;
      background: #f1f1f1;
      overflow:hidden;
      position:relative;
      z-index:6;
    }
    .progress .bar{
      position:absolute;
      left:-40%;
      top:0;
      height:100%;
      width:40%;
      background:linear-gradient(90deg, rgba(11,11,11,1), rgba(11,11,11,0.6), rgba(11,11,11,1));
      border-radius:999px;
      animation: progress 2.6s cubic-bezier(.2,.8,.2,1) infinite;
    }
    @keyframes progress {
      0% { transform: translateX(0%); left:-40%; opacity:1; }
      50% { left:40%; opacity:1; transform: skewX(-8deg); }
      100% { left:120%; opacity:0; transform: skewX(0deg); }
    }

    /* small footer / status badges */
    .hud{
      position:absolute;
      bottom:18px;
      left:22px;
      display:flex;
      gap:10px;
      z-index:6;
      opacity:0.42;
      font-size:10px;
      align-items:center;
    }
    .dot{ width:8px;height:8px;border-radius:50%;background:#10b981; display:inline-block; box-shadow:0 1px 0 rgba(0,0,0,0.06); }

    /* Accessibility: respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce){
      .longfazers span,
      .laser-line,
      .loader,
      .base .core,
      .progress .bar { animation: none !important; transform:none !important; opacity:1 !important; }
    }

    /* responsiveness */
    @media (max-width:520px){
      :root{ --size:120px; }
      .stage{ height:360px; padding:18px; }
      .progress{ width:200px; }
    }
  </style>
</head>
<body>
  <main class="stage" role="main" aria-labelledby="loader-title">

    <!-- background animated lines -->
    <div class="longfazers" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <!-- loader centered -->
    <div class="loader-wrap" role="status" aria-live="polite" aria-label="Loading">
      <div class="loader" title="Processing">
        <div class="lasers" aria-hidden="true">
          <div class="laser-line"></div>
          <div class="laser-line"></div>
          <div class="laser-line"></div>
          <div class="laser-line"></div>
        </div>

        <div class="base" aria-hidden="true">
          <div class="tri"></div>
          <div class="core"></div>
          <div class="fins"></div>
          <div class="face"></div>
        </div>
      </div>
    </div>

    <!-- meta text + progress -->
    <div class="meta" id="loader-title">
      <h1>Processing Request</h1>
      <p>Synchronizing with global neural networks</p>

      <div class="progress" aria-hidden="true">
        <div class="bar"></div>
      </div>
    </div>

    <!-- HUD -->
    <div class="hud" aria-hidden="true">
      <span class="dot" aria-hidden="true"></span>
      <span>SYSTEMS NOMINAL</span>
    </div>

  </main>
</body>
</html>
